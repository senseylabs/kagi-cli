name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # Root module: github.com/senseylabs/kagi-cli
  root:
    name: root module (vet + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go test -race
        run: go test -race ./...

  # SDK is a separate module (github.com/senseylabs/kagi-sdk); it has its own
  # go.mod, so it must be vetted and tested on its own from within sdk/.
  sdk:
    name: sdk module (vet + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: sdk/go.mod
          cache: true

      - name: go vet
        run: cd sdk && go vet ./...

      - name: go test -race
        run: cd sdk && go test -race ./...

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # golangci-lint v2 to match .golangci.yml (version: "2"). The v6 action
      # installs the v1 line, which rejects the v2 config; v7+ installs v2.
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.1.6

      # The sdk is a separate module; golangci-lint won't cross module
      # boundaries, so lint it from within sdk/. The root .golangci.yml is
      # discovered by walking up the tree, so the same config applies.
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.1.6
          working-directory: sdk
